[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afs"
version = "0.1.0"
description = "Adaptive Frame Selection for Efficient Video Understanding"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["afs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
