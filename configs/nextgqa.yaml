# NExT-GQA: real videos, real questions, and ground-truth temporal grounding.
#
# The grounding is what makes this the main config rather than nextqa.yaml:
# because we know which seconds contain the answer, the oracle is exact and
# "evidence recall" is measurable - so selection can be evaluated properly
# even with the CPU mock reader, before any GPU is involved.
#
# Set AFS_DATA to the folder holding `nextgqa/` (keep it OUT of any synced
# folder - the videos are ~6.6 GB):
#     Windows (PowerShell):  $env:AFS_DATA = "$HOME\Documents\cv_data"
#     Linux / macOS:         export AFS_DATA=~/cv_data

seed: 0

paths:
  cache_dir: ${AFS_DATA}/cache
  runs_dir: runs/nextgqa

dataset:
  name: nextgqa
  root: ${AFS_DATA}/nextgqa
  split: val
  evidence_mode: any      # NExT-GQA's spans are alternative groundings
  require_grounding: true
  require_video: true
  # Tuning protocol. The 500 cached questions are split into two disjoint
  # halves from the same shuffle: choose hyperparameters with offset=0, report
  # with offset=250. Tuning on the questions you report on inflates every
  # number, and with a few hundred questions the inflation is the same size as
  # the effects we are chasing.
  limit: 250
  offset: 250             # the REPORTING split; use offset=0 to tune

frames:
  # Measured on the val subset: duration median 35 s, p10 15 s. At 1 fps the
  # median candidate pool is only 35 frames, so a budget of 16-32 would be
  # most of the video and "selection" would mean nothing. At 2 fps the median
  # pool is 70, keeping N/K >= 4 for the median video at our largest budget.
  fps: 2.0
  max_candidates: 128
  size: [224, 224]

encoder:
  name: hf_clip
  model_name: google/siglip-base-patch16-224
  batch_size: 32

# CPU-friendly default: scores selection against the ground-truth grounding,
# no GPU and no VLM. Switch to the real reader once you have a GPU:
#   --config configs/nextgqa.yaml reader.name=hf_vlm
reader:
  name: needle
  gflops_per_frame: 600.0

cost:
  encoder_gflops_per_frame: 4.4

budget:
  K: 8
  adaptive: false
  K_min: 2
  K_max: 32

selector:
  name: submodular
  alpha: 1.0
  beta: 1.0
  # Tuned on the dev split (offset=0). The toy's 0.25 is clearly too low on
  # real features; anything in 1..5 is indistinguishable at this sample size.
  gamma: 1.0
  n_time_bins: 32
  time_sigma_frac: 0.05
  use_options: true

sweep:
  # The grounded spans cover ~23% of each video on average, so a single random
  # frame already lands in evidence ~23% of the time and evidence recall
  # saturates by K=8. The informative regime here is the tight budgets.
  budgets: [1, 2, 4, 8, 16]
  selectors: [uniform, random, topk, mmr, submodular, oracle_needle]
